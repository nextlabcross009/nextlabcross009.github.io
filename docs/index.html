<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTLAB</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <my-header class="fixed-header" styles-path="css/styles.css"></my-header>
    <navigation-bar class="fixed-navigation" styles-path="css/styles.css"></navigation-bar>
    
    <div class="main-content">
        <div id="content"></div>
        <my-sidebar styles-path="css/styles.css"></my-sidebar>


    </div>
    <!-- カウンタ表示 -->
    <div class="counter-container">
        counter: <span id="counter">0</span>
    </div>
    <my-footer styles-path="css/styles.css"></my-footer>
    <script>
        //カウンタ処理開始
        // デバッグモードの設定（trueで制限解除）
        const DEBUG_MODE = false;

        function IncreaseCounter() {
            const today = new Date().toISOString().split('T')[0];
            const lastCountDate = localStorage.getItem('lastCountDate');
            
            if (!DEBUG_MODE && today === lastCountDate) {
                // デバッグモードでなく、今日が最後にカウントアップした日付と同じ場合、何もしない
                return;
            }

            let count = parseInt(localStorage.getItem('count') || '0', 10);
            count++;
            localStorage.setItem('count', count);
            if (!DEBUG_MODE) { // デバッグモードでない場合のみ、最後のカウントアップ日を更新
                localStorage.setItem('lastCountDate', today);
            }
            document.getElementById("counter").innerText = count;
        }

        function InitializeCounter() {
            const count = localStorage.getItem('count') || '0';
            document.getElementById("counter").innerText = count;
            IncreaseCounter(); // ページ読み込み時に自動的にカウントアップ
        }
        // DOMが読み込まれた後に実行する処理の前にカウンタを初期化
        InitializeCounter();
        //カウンタ処理終了
        // DOMが読み込まれた後に実行
        document.addEventListener('DOMContentLoaded', async (event) => {
            try {
                // Markdownファイルのパス
                const filePath = 'md/index.md';
                // ファイルをフェッチしてテキストとして取得
                const response = await fetch(filePath);
                const markdownText = await response.text();
                // MarkdownテキストをHTMLに変換
                const htmlContent = marked.parse(markdownText);
                // コンテンツをページに表示
                document.getElementById('content').innerHTML = htmlContent;
            } catch (error) {
                console.error('Markdownファイルの読み込みに失敗しました', error);
            }
        });
    </script>
    <script src="js/base-js.js"></script>
</body>
</html>
